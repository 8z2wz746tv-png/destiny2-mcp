[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "destiny-mcp"
version = "0.1.0"
description = "Destiny 2 MCP Server — 通过 AI Agent 管理武器和装备"
requires-python = ">=3.12"
dependencies = [
    "aiobungie>=0.5.0",
    "mcp[cli]>=1.27.2",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "httpx>=0.28.0",
    "pyyaml>=6.0",
]

[project.scripts]
destiny-mcp = "destiny_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "mypy>=1.10", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
exclude = ["scripts/", "tests/"]
