[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "destiny-mcp"
version = "0.1.0"
description = "Destiny 2 MCP Server — 通过 AI Agent 管理武器和装备"
requires-python = ">=3.12"
dependencies = [
    "aiobungie>=0.5.0",
    "anyio>=4.5",
    "mcp[cli]>=1.27.2",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "httpx>=0.28.0",
    "pyyaml>=6.0",
]

[project.scripts]
destiny-mcp = "destiny_mcp.server:main"
destiny-mcp-oauth = "destiny_mcp.oauth_setup:main"
destiny-mcp-fetch-wishlists = "destiny_mcp.wishlist_data:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "mypy>=1.10", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["destiny_mcp*"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
destiny_mcp = ["data/*.yaml", "data/weapon_popularity.json"]
"destiny_mcp.build_import" = ["*.yaml"]

[tool.setuptools.data-files]
"share/destiny-mcp/prompts" = ["prompts/*.md"]
"share/destiny-mcp/skills" = ["skills/*.md"]
"share/destiny-mcp/skills/destiny2-mcp" = ["skills/destiny2-mcp/SKILL.md"]
"share/destiny-mcp/skills/destiny2-mcp/references" = ["skills/destiny2-mcp/references/*.md"]
"share/destiny-mcp/skills/destiny2-mcp/agents" = ["skills/destiny2-mcp/agents/openai.yaml"]
"share/destiny-mcp/skills/destiny-mcp-setup" = ["skills/destiny-mcp-setup/SKILL.md"]
"share/destiny-mcp/skills/destiny-mcp-setup/agents" = ["skills/destiny-mcp-setup/agents/openai.yaml"]
"share/destiny-mcp/skills/destiny-mcp-setup/scripts" = ["skills/destiny-mcp-setup/scripts/verify_mcp.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
exclude = ["scripts/", "tests/"]
