[build-system]
# >=77 才有 PEP 639 的 `license = "MIT"` + `license-files`（老版本只认 table 写法）。
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "destiny-mcp"
version = "0.5.0"
description = "Destiny 2 MCP Server — 通过 AI Agent 管理武器和装备"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "aiobungie>=0.5.0",
    "anyio>=4.5",
# 上界是必须的：mcp 2.x 把 `mcp.server.fastmcp` 改名成 MCPServer，
# 没有上界时干净机器上装到 2.x，服务连 import 都过不去（本机装着 1.x 看不出来）。
    "mcp[cli]>=1.27.2,<2",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "httpx>=0.28.0",
    "pyyaml>=6.0",
]

[project.scripts]
destiny-mcp = "destiny_mcp.server:main"
destiny-mcp-oauth = "destiny_mcp.oauth_setup:main"
destiny-mcp-fetch-wishlists = "destiny_mcp.wishlist_data:main"

[project.optional-dependencies]
# ruff 钉范围：它的**默认规则集随版本变**（0.16 起把 UP/SIM/FURB/TRY… 都算默认），
# 不钉就会出现"本地绿、CI 红"——2026-09-18 真踩过：CI 装到 0.16.8，一次报 333 条。
# 规则集本身在 [tool.ruff.lint] 里写死；要收更多规则就同时改这两处（有意为之，不静默漂移）。
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "mypy>=1.10", "ruff>=0.15,<0.16"]

[tool.setuptools.packages.find]
where = ["."]
include = ["destiny_mcp*"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
destiny_mcp = ["data/*.yaml", "data/weapon_popularity.json"]

[tool.setuptools.data-files]
"share/destiny-mcp" = ["docs/community/COMMUNITY_DATA_NOTICE.md"]
"share/destiny-mcp/prompts" = ["prompts/*.md"]
"share/destiny-mcp/skills" = ["skills/*.md"]
"share/destiny-mcp/skills/destiny2-mcp" = ["skills/destiny2-mcp/SKILL.md"]
"share/destiny-mcp/skills/destiny2-mcp/references" = ["skills/destiny2-mcp/references/*.md"]
"share/destiny-mcp/skills/destiny2-mcp/agents" = ["skills/destiny2-mcp/agents/openai.yaml"]
"share/destiny-mcp/skills/destiny-mcp-setup" = ["skills/destiny-mcp-setup/SKILL.md"]
"share/destiny-mcp/skills/destiny-mcp-setup/agents" = ["skills/destiny-mcp-setup/agents/openai.yaml"]
"share/destiny-mcp/skills/destiny-mcp-setup/scripts" = ["skills/destiny-mcp-setup/scripts/verify_mcp.py"]
"share/destiny-mcp/community" = ["share/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
exclude = ["scripts/", "tests/"]

[tool.ruff]
# `legacy/` 是剥离出去的历史工具面存档（见 legacy/README.md）：只作查阅，不参与 lint。
# 它本来就不进包（packages.find 只收 destiny_mcp*）、不进测试（testpaths=["tests"]），这里再挡一道。
extend-exclude = ["legacy"]

[tool.ruff.lint]
# 规则集写死成仓库一直干净的那四个家族：E4/E7/E9（导入与语句）+ F（pyflakes）。
# F 里的 F821「未定义的 name」是真抓过 bug 的：build_service 用了没导入的
# `profile_components`（build 取账号护甲那条路直接 NameError）、activity_service 缺
# `player_names` 导入 —— 这类问题单测不一定跑得到，静态检查一眼就有。
# 想收更多规则（UP/SIM/FURB/I…）就显式加进来并一次修完，别靠"跟着 ruff 的默认集漂移"。
select = ["E4", "E7", "E9", "F"]
