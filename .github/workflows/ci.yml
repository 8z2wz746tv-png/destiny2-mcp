# 每次 push / PR 跑一遍**不需要账号**的守门：单元测试 + 契约测试 + 分层守门
# （后两者都在 pytest 里：test_skill_contracts / test_architecture_layers 等）。
#
# 真机脚本不进 CI：`skills/destiny-mcp-setup/scripts/verify_mcp.py`、
# `scripts/run_corpus_*.py`、`capture_weapon_baseline.py` 都需要 `.env`、OAuth token、
# 本地 Manifest 与真账号，只能在本机按 docs/testing/TESTING_CORPUS.md 的流程手动跑。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装（含 dev 依赖）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      # 静态检查放最前面：它抓的是「未定义的 name / 未使用的 import」这一类，比测试更早更便宜。
      # 规则集在 pyproject 的 [tool.ruff.lint] 里**写死**、版本也钉了范围：
      # ruff 的默认集随版本变（0.16 起把 UP/SIM/FURB/TRY… 都算默认），不钉就出现
      # 「本地绿、CI 红」——2026-09-18 连挂三次 CI，全是这一步报 333 条。
      # 真机上就靠它抓到过 `profile_components` 用了没导入（build 取账号护甲那条路 NameError）
      # 与 activity_service 缺 player_names 导入。
      - name: 静态检查（ruff）
        run: python -m ruff check
      # mypy 暂不进 CI：存量 411 个错（70 个文件），一次修不完。路线是「新代码先干净」——
      # 想纳入某个模块，先把它修到 mypy 干净，再加进下面这行的文件列表；
      # 列表覆盖够了再换成全仓。现在它是本地工具，不是门槛。
      # - name: 类型检查（mypy，逐步纳入）
      #   run: python -m mypy destiny_mcp/services/pvp_weapon_service.py destiny_mcp/services/pgcr_cache.py
      - name: 单元测试 + 契约/分层守门
        run: python -m pytest -q
      - name: 没有凭据也能构造工具面（干净克隆冒烟）
        env:
          BUNGIE_API_KEY: ci-placeholder
          BUNGIE_CLIENT_ID: "1"
          BUNGIE_CLIENT_SECRET: ci-placeholder
        run: |
          python -c "from destiny_mcp.server import create_server; create_server('normal'); print('create_server ok')"
